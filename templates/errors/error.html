{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ status_code }} · FocusForge</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <main style="align-items:center;display:flex;justify-content:center;min-height:100dvh;padding:24px;text-align:center">
    <section class="card" style="max-width:460px;padding:38px 30px">
      <p style="color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.08em">ERROR {{ status_code }}</p>
      <h1 style="font-size:28px;margin:10px 0">{{ title }}</h1>
      <p style="color:var(--text-2);line-height:1.6">{{ message }}</p>
      <a class="btn btn-primary" href="{% url 'core:dashboard' %}" style="margin-top:22px">Return to dashboard</a>
    </section>
  </main>
</body>
</html>
