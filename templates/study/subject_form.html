{% extends 'base.html' %}
{% load static %}

{% block title %}New Subject · FocusForge{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/main.css' %}">
{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <a href="{% url 'study:study_dashboard' %}">← Study Sessions</a>
    <h2>New Subject</h2>
  </div>
</div>

<section class="card form-card">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Name</label>
      {{ form.name }}
      {{ form.name.errors }}
    </div>
    <div class="form-group">
      <label>Color</label>
      {{ form.color }}
    </div>
    <button class="btn btn-primary">Add Subject</button>
  </form>
</section>
{% endblock %}
