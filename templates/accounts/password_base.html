{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Password reset — FocusForge{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="reset-page">
        <div class="bg-glow"></div>
        <div class="bg-rings"></div>
        <a href="{% url 'accounts:login' %}" class="reset-brand"><img class="brand-logo" src="{% static 'images/focusforge-logo.png' %}" alt="FocusForge logo"><span>Focus<span class="accent">Forge</span></span></a>
        <section class="reset-card">
            <div class="reset-icon"><i class="bi {% block reset_icon %}bi-shield-lock{% endblock %}"></i></div>
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
